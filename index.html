<head>

<title>LLP Projetos | Projeto não é burocracia</title>
<meta name="description" content="LLP Projetos — Projeto não é burocracia. Solicite sua proposta pelo WhatsApp.">
<meta name="theme-color" content="#1f3566">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1f3566;
    --navy-dark: #16254a;
    --green: #2f6b3a;
    --green-light: #3f8a4d;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
    color: var(--white);
    background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 38%, var(--green) 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 40px 20px 28px;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: calc(100vh - 68px);
  }

  .logo-wrap {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: #fff;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .28), 0 0 0 5px rgba(255, 255, 255, .18);
    overflow: hidden;
    animation: pop .7s cubic-bezier(.2, .9, .3, 1.2) both;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: scale(.8);
    display: block;
  }

  h1 {
    margin-top: 22px;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: .5px;
    text-align: center;
    animation: rise .6s .15s ease both;
  }

  .tagline {
    margin-top: 6px;
    font-size: 1.02rem;
    font-weight: 600;
    opacity: .92;
    text-align: center;
    animation: rise .6s .25s ease both;
  }

  .links {
    list-style: none;
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .links li {
    opacity: 0;
    animation: rise .6s ease forwards;
    animation-delay: calc(.4s + var(--i) * .12s);
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .96);
    color: var(--navy);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
    transition: transform .22s ease, box-shadow .22s ease, background .22s ease, color .22s ease;
  }

  .btn .ico {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, rgba(31, 53, 102, .10), rgba(47, 107, 58, .16));
    color: var(--navy);
    transition: background .22s ease, color .22s ease, transform .22s ease;
  }

  .btn .ico svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn:hover .ico, .btn:focus-visible .ico {
    background: linear-gradient(135deg, var(--green-light), var(--green));
    color: #fff;
    transform: rotate(-6deg) scale(1.06);
  }

  .btn.primary .ico {
    background: rgba(255, 255, 255, .2);
    color: #fff;
  }

  .btn.primary:hover .ico, .btn.primary:focus-visible .ico {
    background: rgba(255, 255, 255, .32);
  }

  .btn > span:not(.ico) { flex: 1; text-align: center; padding-right: 44px; }

  .btn:hover, .btn:focus-visible {
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 12px 26px rgba(0, 0, 0, .3);
    background: #fff;
    color: var(--green);
    outline: none;
  }

  .btn:active { transform: translateY(0) scale(.99); }

  .btn.primary {
    background: linear-gradient(135deg, var(--green-light), var(--green));
    color: #fff;
    border: 2px solid rgba(255, 255, 255, .55);
  }

  .btn.primary:hover, .btn.primary:focus-visible {
    background: linear-gradient(135deg, #4a9a59, var(--green-light));
    color: #fff;
  }

  footer {
    margin-top: auto;
    padding-top: 34px;
    font-size: .8rem;
    opacity: .7;
    text-align: center;
    animation: rise .6s 1.1s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.8); }
    to   { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 380px) {
    .logo-wrap { width: 144px; height: 144px; }
    h1 { font-size: 1.5rem; }
    .btn { padding: 14px 16px; font-size: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .links li { opacity: 1; }
  }
</style>
</head>
